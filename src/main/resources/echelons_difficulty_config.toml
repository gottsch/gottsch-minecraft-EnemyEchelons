# this is a catch-all echelon config. this config will be used if a dimension isn't specified in another config
# use "." or ".:." or "*" or "*:*" for the dimension
# by default, this echelon is setup to not provide any modifications, ie mobs remain at vanilla/default levels.
[[configs]]
	id="eechelons:catch_all"
	dimensions=["."]
	hpFactor=0.0
	[[configs.echelons]]
		min=-64
		max=319
		[[configs.echelons.histogram]]
			difficulty=0
			weight=1.0